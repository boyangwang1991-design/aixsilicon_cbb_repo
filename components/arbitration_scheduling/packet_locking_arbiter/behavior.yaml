requirements:
  - id: REQ-001
    description: Grant is one-hot-or-zero; reset forces grant zero; initially requester zero has highest priority.
    properties: [PROP-PLA_MUTEX-001]
    tests: [tc_reset_mutex]
    configs: [cfg_num_req4_lock_mode0_len_w8, cfg_num_req1_lock_mode0_len_w8]
  - id: REQ-002
    description: First visible grant reserves owner across sampled backpressure and request bubbles; no competing source may interleave.
    properties: [PROP-PLA_HOLD-002]
    tests: [tc_stall_bubble]
    configs: [cfg_num_req4_lock_mode0_len_w8, cfg_num_req4_lock_mode1_len_w8]
  - id: REQ-003
    description: EOP mode releases only on ready_i and selected req_i and selected eop_i; single-beat packets release immediately.
    properties: [PROP-PLA_EOP-003]
    tests: [tc_eop, tc_single_beat]
    configs: [cfg_num_req4_lock_mode0_len_w8, cfg_num_req3_lock_mode0_len_w8]
  - id: REQ-004
    description: Length mode samples selected length on reservation, counts accepted beats including first beat, ignores EOP, and releases exactly at sampled length.
    properties: [PROP-PLA_LENGTH-004]
    tests: [tc_length, tc_length_stall]
    configs: [cfg_num_req4_lock_mode1_len_w8]
  - id: REQ-005
    description: Priority rotates only after packet completion to successor of owner modulo NUM_REQ; consecutive packets have no required bubble.
    properties: [PROP-PLA_RR-005]
    tests: [tc_rr_order, tc_back_to_back, tc_random]
    configs: [cfg_num_req3_lock_mode0_len_w8, cfg_num_req64_lock_mode0_len_w8]
  - id: REQ-006
    description: With eventual owner progress and completion, a continuously eligible requester waits at most NUM_REQ-1 other completed packets.
    properties: [PROP-PLA_FAIR-006]
    tests: [tc_fairness]
    configs: [cfg_num_req4_lock_mode0_len_w8, cfg_num_req4_lock_mode1_len_w8]
  - id: REQ-007
    description: Length zero is ineligible before reservation in length mode; legal contenders continue; invalid elaboration parameters are rejected.
    properties: []
    tests: [tc_zero_length, tc_negative_params]
    configs: [cfg_num_req4_lock_mode1_len_w8, cfg_num_req0_lock_mode0_len_w8, cfg_num_req65_lock_mode0_len_w8, cfg_num_req4_lock_mode2_len_w8, cfg_num_req4_lock_mode0_len_w0, cfg_num_req4_lock_mode0_len_w17]
invariants:
  - id: INV-001
    description: fire = ready_i and OR(grant_o and req_i); grant denotes ownership, not accepted data.
  - id: INV-002
    description: Locked owner is unchanged until packet completion or reset, including cycles with its req_i low.
  - id: INV-003
    description: Idle request eligibility is req_i and (LOCK_MODE equals zero or packet length is nonzero).
assumptions:
  - id: ASM-001
    description: All inputs are synchronous 2-state values; reset deassertion is synchronized externally.
  - id: ASM-002
    description: Unaccepted valid beat and its EOP metadata remain stable; packet length is stable until reservation. After a beat is accepted, owner may insert arbitrary valid bubbles.
  - id: ASM-003
    description: Consumer muxes payload using grant_o and gates outgoing valid with OR(grant_o and req_i); ready_i reflects downstream acceptance capacity without a combinational loop.
  - id: ASM-004
    description: Fairness requires eventual downstream acceptance, resumed owner valid, and EOP or sufficient declared-length beats; no cycle-bound or byte-weight fairness is promised.
timing:
  first_grant_latency_cycles: 0
  reservation: First rising edge with visible eligible grant, even if ready_i is low.
  length_sampling: At reservation edge, including a first-beat handshake on that edge.
  completion: Rising edge accepting final beat; next cycle may grant next packet.
  reset: Asynchronous reset clears ownership and resets round-robin priority; all outputs masked during reset.
exceptions:
  - id: EXC-001
    description: Missing EOP or truncated declared-length packet retains ownership indefinitely; reset is recovery.
  - id: EXC-002
    description: Zero runtime length receives no grant in length mode and must be repaired by producer; no hardware error port.
non_goals:
  - Payload multiplexing, buffering, CSR, CDC, abort, watchdog or automatic packet discard.
  - Weighted, byte-fair or deficit scheduling; registered output and multiple implementation profiles in version 0.1.0.
