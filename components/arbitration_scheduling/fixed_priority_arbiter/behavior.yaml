# ============================================================
# fixed_priority_arbiter 行为契约 (behavior.yaml) —— SSOT
# 固定优先级仲裁：授权互斥 + 优先级链语义 + 可选锁存/寄存授权
# ============================================================

invariants:
  - id: INV-001
    description: >-
      授权互斥——对任意合法 2-state 请求向量，grant_o 中至多一位有效
      （无多授权、无授权冲突）。
    properties: [PROP-FPA_MUTEX-001]
    tests: [tc_mutex, tc_random, tc_exhaust_w4]
  - id: INV-002
    description: >-
      优先级语义——PRIORITY=0 时 grant 为请求向量中最低有效位（LSB 优先，即 req[0]
      最高优先级）；PRIORITY=1 时 grant 为最高有效位（MSB 优先，req[N-1] 最高优先级）。
      与黄金模型（从高到低扫描首个置位）一致。
    properties: [PROP-FPA_PRIO-002]
    tests: [tc_priority, tc_edge]
  - id: INV-003
    description: >-
      无请求 → grant_o 全零；有请求 → 恰好一个授权（活性：不丢授权）。
    properties: [PROP-FPA_NONE-003]
    tests: [tc_edge]
  - id: INV-004
    description: >-
      REQ_TYPE=1（latched）——请求被内部寄存；grant 保持至 grant_ack_i 上升沿后清除；
      清除后若原请求仍有效则重新授权（或按当前优先级重选）；ack 时无保持请求 → grant=0。
    properties: [PROP-FPA_LATCH-004]
    tests: [tc_latched]
  - id: INV-005
    description: >-
      FAST_GRANT=1（registered）——grant_o 相对组合参考模型延迟 1 拍，
      且每周期组合参考（req_i 经优先级选择）等于寄存 grant 一拍前的期望。
    properties: [PROP-FPA_REG-005]
    tests: [tc_registered, tc_equiv]

assumptions:
  - id: ASM-001
    description: 输入 X/Z 不承诺（2-state 仿真语义；X 传播视为未定义）。
  - id: ASM-002
    description: REQ_TYPE=1 时 grant_ack_i 必须在 grant_o 有效后的下一拍内拉高（或在授权
      保持期间），否则授权保持（防活锁由消费方保证）。
  - id: ASM-003
    description: PRIORITY 与 PC_IMPL 为编译期参数，不运行时切换（生成/参数化语义）。
  - id: ASM-004
    description: FAST_GRANT=1 需要 clk/rst_n；纯组合配置（FAST_GRANT=0 且 REQ_TYPE=0）
      可不接时钟（RTL 仍保留端口，接 clk 亦可）。

non_goals:
  - 轮转/加权/公平性调度（RR/WRR/Deficit，见 ARB-002/003/004）
  - 多授权（top-K 同时授权，见 ARB-007 multi_grant_arbiter）
  - 层次化跨模块仲裁（见 ARB-008 hierarchical_arbiter）
  - 流水化/多拍事务语义（单周期决策；寄存授权仅 1 拍延迟）
