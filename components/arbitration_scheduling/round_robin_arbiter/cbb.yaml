# ============================================================
# cbb.yaml — round_robin_arbiter SSOT 元数据（ARB-002, A2/P0）
# Round-robin Arbiter：授权互斥 + 轮转公平（等权，无静态优先）
# 嵌套依赖：无（dependencies 为空）；验证资产随包自足
# ============================================================

schema_version: 1.0

cbb:
  id: aixsilicon:cbb:round_robin_arbiter
  name: round_robin_arbiter
  version: 0.1.0
  owner: aixsilicon:cbb
  maturity: E0
  license: Apache-2.0

classification:
  abstraction: A2                    # 通用复合：仲裁机制（非协议绑定）
  primary_domain: arbitration_scheduling
  secondary_domains: [selection_decode]

contract:
  interface: native_req_grant         # 原生 request/grant 位向量，无总线协议语义
  clock_domains: 1                    # REQ_TYPE=1 / FAST_GRANT=1 时使用 clk/rst_n（寄存）；纯组合时可选
  ordering: in_order                  # 授权按轮转顺序发出（每拍至多一授权，无事务序列）
  throughput: 1_per_cycle             # 组合路径即时；FAST_GRANT=1 为每拍一授权（1 拍延迟）

# ---------------- 可配置参数 ----------------
parameters:
  NUM_REQ:
    type: int
    default: 8
    legal: {min: 2, max: 64}
    partitions: [2, 4, 8, 16, 32, 64]
    affects: [interface_width, area, timing]
    semantics: 请求输入端数（请求向量位宽）
  REQ_TYPE:
    type: int
    default: 0
    legal: [0, 1]
    partitions: [0, 1]
    affects: [area, timing, state_space]
    semantics: >-
      0=level（组合，每周期按当前 req_i 决策，不锁定）；
      1=latched（内部寄存输入请求，直到 grant 被消费方以 grant_ack_i 应答后清除；
        多拍保持授权，适合慢速/需稳定授权的场景）
  FAST_GRANT:
    type: int
    default: 0
    legal: [0, 1]
    partitions: [0, 1]
    affects: [latency, timing, area]
    semantics: >-
      0=combinational（grant_o 与 req_i 同拍组合输出，零延迟）；
      1=registered（grant_o 输出寄存，1 拍授权延迟；关键路径从 req_i→grant_o 变为
        reg→grant_o，时序更优；时钟复位：异步复位有效）
  PC_IMPL:
    type: int
    default: 0
    legal: [0, 1, 2]
    partitions: [0, 1, 2]
    affects: [area, timing]
    semantics: >-
      微架构选择（挂实现/Profile，不进公共功能语义）：
      0=mask 显式轮转掩码优先链（O(N) 深度，最小面积，经典 RR mask 法）；
      1=rotate+priority 旋转索引 + 优先级选择（O(log N) 深度，时序优）；
      2=pointer 二进制指针 + 循环移位选择（面积/时序折中，N 大时 LUT 友好）
  GRANT_ACK_EN:
    type: int
    default: 0
    legal: [0, 1]
    partitions: [0, 1]
    affects: [area, timing, state_space]
    semantics: >-
      0=grant 每拍按当前请求重新决策（纯轮转，无锁定，公平窗口=每拍一授权）；
      1=grant 锁定到 grant_ack_i 应答后轮转（消费方背压感知；防授权在未被消费前
        反复切换；适合慢速/需稳定授权场景）

constraints:
  - id: PC-001
    expression: "NUM_REQ >= 2"
    severity: error                   # 仲裁至少 2 路（单路无仲裁语义）
  - id: PC-002
    expression: "NUM_REQ <= 64"
    severity: error                   # RTL 平面/时序上界（64 路轮转）
  - id: PC-003
    expression: "REQ_TYPE >= 0 and REQ_TYPE <= 1"
    severity: error                   # 编码合法域
  - id: PC-004
    expression: "FAST_GRANT >= 0 and FAST_GRANT <= 1"
    severity: error
  - id: PC-005
    expression: "PC_IMPL >= 0 and PC_IMPL <= 2"
    severity: error
  - id: PC-006
    expression: "GRANT_ACK_EN >= 0 and GRANT_ACK_EN <= 1"
    severity: error

# ---------------- 需求（REQ→PROP/tests/configs 映射）----------------
requirements:
  - id: REQ-001
    description: 授权互斥——任意合法请求组合最多一个 grant_o 有效（无多授权/无授权冲突）
    properties: [PROP-RRA_MUTEX-001]
    tests: [tc_mutex, tc_random, tc_exhaust_w4]
    configs:
      - cfg_num_req2_req_type0_fast_grant0_pc_impl0_grant_ack_en0
      - cfg_num_req8_req_type0_fast_grant0_pc_impl0_grant_ack_en0
      - cfg_num_req64_req_type0_fast_grant0_pc_impl0_grant_ack_en0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-002
    description: 轮转公平——连续请求下授权按 RR 顺序轮流（无固定优先；单请求一直有效则重复授权同一位）
    properties: [PROP-RRA_FAIR-002]
    tests: [tc_rr_order, tc_random]
    configs:
      - cfg_num_req8_req_type0_fast_grant0_pc_impl0_grant_ack_en0
      - cfg_num_req8_req_type0_fast_grant0_pc_impl1_grant_ack_en0
      - cfg_num_req8_req_type0_fast_grant0_pc_impl2_grant_ack_en0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-003
    description: 无请求时 grant 全零；有请求必有且仅有一个授权（活性）
    properties: [PROP-RRA_NONE-003]
    tests: [tc_edge, tc_random]
    configs:
      - cfg_num_req4_req_type0_fast_grant0_pc_impl0_grant_ack_en0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-004
    description: REQ_TYPE=1（latched）——请求被寄存，grant 保持直到 grant_ack_i 应答后清除；应答无请求时清除为 0
    properties: [PROP-RRA_LATCH-004]
    tests: [tc_latched]
    configs:
      - cfg_num_req8_req_type1_fast_grant0_pc_impl0_grant_ack_en0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-005
    description: FAST_GRANT=1（registered）——grant_o 比组合授权延迟 1 拍，且与组合授权（考虑延迟）一致
    properties: [PROP-RRA_REG-005]
    tests: [tc_registered, tc_equiv]
    configs:
      - cfg_num_req8_req_type0_fast_grant1_pc_impl0_grant_ack_en0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-006
    description: 多实现（mask/rotate+priority/pointer）共享同一可观察契约且等价
    properties: [PROP-RRA_EQV-006]
    tests: [tc_equiv, tc_rr_order]
    configs:
      - cfg_num_req8_req_type0_fast_grant0_pc_impl0_grant_ack_en0
      - cfg_num_req32_req_type0_fast_grant0_pc_impl0_grant_ack_en0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-007
    description: GRANT_ACK_EN=1——grant 锁定到 ack 应答后才轮转；ack 应答后按 RR 顺序移动到下一请求
    properties: [PROP-RRA_ACK-007]
    tests: [tc_ack_lock]
    configs:
      - cfg_num_req8_req_type0_fast_grant0_pc_impl0_grant_ack_en1
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-008
    description: 非法参数组合在 Elaboration 期被拦截
    properties: []                    # 负向编译证据（非 SVA）
    tests: [tc_negative_elab]
    configs:
      - cfg_num_req1_req_type0_fast_grant0_pc_impl0_grant_ack_en0
      - cfg_num_req65_req_type0_fast_grant0_pc_impl0_grant_ack_en0
    evidence: [build/eda/evidence/g3_static/compile.txt]

# ---------------- 实现变体（多实现：轮转结构 trade-off）----------------
implementations:
  - id: impl_mask                  # PC_IMPL=0 显式轮转掩码优先链（O(N) 深度，经典 mask 法）
    source: rtl/
    constraints: constraints/
    dependencies: []
    files:
      - rtl/round_robin_arbiter.sv
  - id: impl_rotate_prio           # PC_IMPL=1 旋转索引 + 优先级选择（O(log N) 深度）
    source: rtl/
    constraints: constraints/
    dependencies: []
    files:
      - rtl/round_robin_arbiter.sv
  - id: impl_pointer               # PC_IMPL=2 二进制指针 + 循环移位选择（折中）
    source: rtl/
    constraints: constraints/
    dependencies: []
    files:
      - rtl/round_robin_arbiter.sv

# ---------------- 质量门禁（G0~G8）----------------
quality:
  required_gates: [G0, G1, G2, G3, G4, G5, G6, G7, G8]

# ---------------- PPA 表征 ----------------
characterization:
  benchmark_profiles: []
  measured_region:                   # G6 实测（run-20260829-01，15 点）：NUM_REQ∈{4,8,16,32,64}×{mask,rotate_prio,pointer}
    NUM_REQ: [4, 8, 16, 32, 64]
    PC_IMPL: [0, 1, 2]
  pdk_context: characterization/pdk.yaml   # PDK_READY（sc9_cmos28lp_base_hvt tt_1p00v_25c，DC 综合 E2）

release:
  fusesoc_core: aixsilicon:cbb:round_robin_arbiter:0.1.0
