# 验证计划（Verification Plan）— round_robin_arbiter
# 声明验证形态（Simulation/Formal 等价/负向 Elaboration/变异）、用例→需求映射、
# 结果解释与证据位置（见 cbb-development-suite references/verification-strategy.md）。
# 形态默认：轻量 SVA（模块内 @(posedge clk) 并发断言）+ 定向/随机 VCS 仿真 +
# 跨实现等价 + 负向 Elaboration + 变异（SVA 有效性）。
target: round_robin_arbiter
verification_forms: [simulation, cross_impl_equiv, negative_elab, mutation]
configs: []
testcases:
  - id: tc_exhaust_w4
    requirement: REQ-001
    invariants: [INV-001]
    form: simulation
    description: N=4 全空间 16 请求向量穷举 × {mask,rotate_prio,pointer}，授权互斥 + 轮转公平 + 三实现等价校验
    execution: verification/scripts/run_functional_sim.sh
  - id: tc_rr_order
    requirement: REQ-002
    invariants: [INV-002]
    form: simulation
    description: 轮转公平序——固定全请求 0xF 下授权按 0,1,2,3 循环轮流（无固定优先，无饿死）
    execution: verification/scripts/run_functional_sim.sh
  - id: tc_mutex
    requirement: REQ-001
    invariants: [INV-001]
    form: simulation
    description: 随机请求向量（N=64），$countones(grant)<=1 全校验（含模块内 SVA 兜底）
    execution: verification/scripts/run_functional_sim.sh
  - id: tc_random
    requirement: REQ-003
    invariants: [INV-003]
    form: simulation
    description: 随机请求 + 黄金模型（从 rr_ptr 回绕扫描首个置位）比对 + 三实现跨实现一致（N=64, 2000 次）
    execution: verification/scripts/run_functional_sim.sh
  - id: tc_edge
    requirement: REQ-003
    invariants: [INV-003]
    form: simulation
    description: 边界——全 0 请求→grant=0；单请求→对应位授权
    execution: verification/scripts/run_functional_sim.sh
  - id: tc_latched
    requirement: REQ-004
    invariants: [INV-004]
    form: simulation
    description: REQ_TYPE=1 锁存——请求后 grant 保持；ack 后清除；ack 无请求时 grant=0
    execution: verification/scripts/run_functional_sim.sh
  - id: tc_registered
    requirement: REQ-005
    invariants: [INV-005]
    form: simulation
    description: FAST_GRANT=1 寄存授权——grant_o 比组合授权延迟 1 拍，且与组合黄金模型一致
    execution: verification/scripts/run_functional_sim.sh
  - id: tc_equiv
    requirement: REQ-006
    invariants: [INV-005]
    form: cross_impl_equiv
    description: mask/rotate_prio/pointer 跨实现一致——同请求向量下三实现 grant 相同（含 N=4/64 穷举与随机）
    execution: verification/scripts/run_functional_sim.sh
  - id: tc_ack_lock
    requirement: REQ-007
    invariants: [INV-006]
    form: simulation
    description: GRANT_ACK_EN=1——grant 锁定至 ack 应答后轮转；请求变化不解除锁定；应答后按新 ptr 重选
    execution: verification/scripts/run_functional_sim.sh
  - id: tc_negative_elab
    requirement: REQ-008
    form: negative_elab
    description: 非法参数（NUM_REQ=1/65、REQ_TYPE=2、FAST_GRANT=2、PC_IMPL=3、GRANT_ACK_EN=2）elaboration $error 拦截
    execution: verification/scripts/run_static_checks.sh
  - id: tc_mutation
    requirement: REQ-001
    invariants: [INV-001]
    form: mutation
    description: 变异测试——固定多请求下授权 one-hot 不变量恒成立（SVA 有效性；破坏断言应能检测）
    execution: verification/scripts/run_functional_sim.sh
