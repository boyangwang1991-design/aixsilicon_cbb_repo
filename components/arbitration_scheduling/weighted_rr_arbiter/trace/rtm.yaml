cbb: weighted_rr_arbiter
requirements:
- id: REQ-001
  type: requirement
  description: 授权互斥——任意合法请求组合最多一个 grant_o 有效（无多授权/无授权冲突）
  properties:
  - PROP-WRRA_MUTEX-001
  tests:
  - tc_mutex
  - tc_random
  - tc_quota_window
  configs:
  - cfg_num_req2_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
  - cfg_num_req8_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
  - cfg_num_req64_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
  evidence:
  - build/eda/evidence/g4_functional/functional_sim.txt
- id: REQ-002
  type: requirement
  description: 权重公平（quota）——每轮配额窗口内，各有效请求的授权次数不超过其权重； 连续满请求下，授权次数比例趋近权重比例（无超发、不饿死）
  properties:
  - PROP-WRRA_QUOTA-002
  tests:
  - tc_quota_window
  - tc_random
  configs:
  - cfg_num_req4_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
  - cfg_num_req8_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
  evidence:
  - build/eda/evidence/g4_functional/functional_sim.txt
- id: REQ-003
  type: requirement
  description: 无请求时 grant 全零；有请求必有且仅有一个授权（活性）
  properties:
  - PROP-WRRA_NONE-003
  tests:
  - tc_edge
  - tc_random
  configs:
  - cfg_num_req4_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
  evidence:
  - build/eda/evidence/g4_functional/functional_sim.txt
- id: REQ-004
  type: requirement
  description: smooth WRR（WMODE=1）——按 credit 最大且有权重的请求动态选择， 剩余 credit 跨轮累计；权重比例正确且无负
    credit（不超发）
  properties:
  - PROP-WRRA_SMOOTH-004
  tests:
  - tc_smooth_ratio
  - tc_random
  configs:
  - cfg_num_req8_weight_width4_wmode1_fast_grant0_grant_ack_en0_pc_impl0
  evidence:
  - build/eda/evidence/g4_functional/functional_sim.txt
- id: REQ-005
  type: requirement
  description: FAST_GRANT=1（registered）——grant_o 比组合授权延迟 1 拍，且与组合授权（考虑延迟）一致
  properties:
  - PROP-WRRA_REG-005
  tests:
  - tc_registered
  - tc_equiv
  configs:
  - cfg_num_req8_weight_width4_wmode0_fast_grant1_grant_ack_en0_pc_impl0
  evidence:
  - build/eda/evidence/g4_functional/functional_sim.txt
- id: REQ-006
  type: requirement
  description: 多实现（quota_counter/deficit_rotate）共享同一可观察契约且等价
  properties:
  - PROP-WRRA_EQV-006
  tests:
  - tc_equiv
  - tc_quota_window
  configs:
  - cfg_num_req8_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
  - cfg_num_req8_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl1
  - cfg_num_req32_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
  evidence:
  - build/eda/evidence/g4_functional/functional_sim.txt
- id: REQ-007
  type: requirement
  description: GRANT_ACK_EN=1——grant 锁定到 ack 应答后才轮转；ack 应答后按权重 RR 顺序移动到下一请求
  properties:
  - PROP-WRRA_ACK-007
  tests:
  - tc_ack_lock
  configs:
  - cfg_num_req8_weight_width4_wmode0_fast_grant0_grant_ack_en1_pc_impl0
  evidence:
  - build/eda/evidence/g4_functional/functional_sim.txt
- id: REQ-008
  type: requirement
  description: 非法参数组合在 Elaboration 期被拦截
  properties: []
  tests:
  - tc_negative_elab
  configs:
  - cfg_num_req1_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
  - cfg_num_req8_weight_width1_wmode0_fast_grant0_grant_ack_en0_pc_impl0
  - cfg_num_req8_weight_width17_wmode0_fast_grant0_grant_ack_en0_pc_impl0
  evidence:
  - build/eda/evidence/g3_static/compile.txt
- id: INV-001
  type: requirement
  description: 授权互斥——对任意合法 2-state 请求向量，grant_o 中至多一位有效 （无多授权、无授权冲突）。对 WMODE=0/1 与所有微架构均成立。
  properties:
  - PROP-WRRA_MUTEX-001
  tests:
  - tc_mutex
  - tc_random
  - tc_quota_window
  configs: []
  evidence: []
- id: INV-002
  type: requirement
  description: quota 权重公平（WMODE=0）——每轮配额窗口内，每路有效请求的授权次数不超过其权重值； 所有未饱和路授权完成后整轮重置（各计数清零）；连续满请求下授权比例趋近权重比例，
    不超发、不饿死（每轮至少授予每路一次，若其权重>0 且有请求）。
  properties:
  - PROP-WRRA_QUOTA-002
  tests:
  - tc_quota_window
  - tc_random
  configs: []
  evidence: []
- id: INV-003
  type: requirement
  description: 无请求 → grant_o 全零；有请求 → 恰好一个授权（活性：不丢授权）。 权重为 0 的请求不参与选择（视为无资格，不阻塞其它请求）。
  properties:
  - PROP-WRRA_NONE-003
  tests:
  - tc_edge
  - tc_random
  configs: []
  evidence: []
- id: INV-004
  type: requirement
  description: smooth WRR（WMODE=1，credit 平滑）——每轮按"credit 最大且有资格（权重>0 且有请求）" 的路动态选择；被授权路
    credit 减少 1，未授权路不变；所有资格路 credit 耗尽后统一回补 （各加权重），实现跨轮累计、比例趋近权重且无负 credit（不超发）。
  properties:
  - PROP-WRRA_SMOOTH-004
  tests:
  - tc_smooth_ratio
  - tc_random
  configs: []
  evidence: []
- id: INV-005
  type: requirement
  description: FAST_GRANT=1（registered）——grant_o 相对组合参考模型延迟 1 拍， 且每周期组合参考（req_i/weight_i
    经加权 RR 选择）等于寄存 grant 一拍前的期望。
  properties:
  - PROP-WRRA_REG-005
  tests:
  - tc_registered
  - tc_equiv
  configs: []
  evidence: []
- id: INV-006
  type: requirement
  description: GRANT_ACK_EN=1（ack 锁定）——grant 在未被 grant_ack_i 应答前保持锁定不变； ack 应答后按加权
    RR 顺序移动到下一请求（或重新选择）。此模式要求消费方应答， 否则授权不轮转（防活锁由消费方保证）。
  properties:
  - PROP-WRRA_ACK-007
  tests:
  - tc_ack_lock
  configs: []
  evidence: []
- id: ASM-001
  type: requirement
  description: 输入 X/Z 不承诺（2-state 仿真语义；X 传播视为未定义）。
  properties: []
  tests: []
  configs: []
  evidence: []
- id: ASM-002
  type: requirement
  description: GRANT_ACK_EN=1 时，grant_ack_i 必须在 grant_o 有效后的下一拍内拉高 （或在授权保持期间），否则授权保持（防活锁由消费方保证）。
  properties: []
  tests: []
  configs: []
  evidence: []
- id: ASM-003
  type: requirement
  description: WMODE / FAST_GRANT / GRANT_ACK_EN / PC_IMPL 为编译期参数，不运行时切换 （生成/参数化语义）。
  properties: []
  tests: []
  configs: []
  evidence: []
- id: ASM-004
  type: requirement
  description: FAST_GRANT=1 或 GRANT_ACK_EN=1 需要 clk/rst_n；纯组合配置 （FAST_GRANT=0 且 GRANT_ACK_EN=0）可不接时钟（RTL
    仍保留端口，接 clk 亦可）。
  properties: []
  tests: []
  configs: []
  evidence: []
- id: ASM-005
  type: requirement
  description: 权重端口 weight_i 由上游静态/低频配置提供（每路独立编码）；WRR 公平语义建立在 权重比例之上，权重为 0 的路永不被授权（除非
    WMODE=1 且其为唯一资格路，见 INV-004）。
  properties: []
  tests: []
  configs: []
  evidence: []
- id: ASM-006
  type: requirement
  description: quota 窗口重置时机为"本轮所有未饱和资格路授权完成后的下一拍"；窗口内授权不保证 连续（若某路无请求或权重为 0，其配额不消耗、直接跳过）。
  properties: []
  tests: []
  configs: []
  evidence: []
