# ============================================================
# cbb.yaml — weighted_rr_arbiter SSOT 元数据（ARB-003, A2/P2）
# Weighted Round-robin Arbiter：授权互斥 + 权重公平（quota / smooth WRR）
# 嵌套依赖：无（dependencies 为空）；验证资产随包自足
# ============================================================

schema_version: 1.0

cbb:
  id: aixsilicon:cbb:weighted_rr_arbiter
  name: weighted_rr_arbiter
  version: 0.1.0
  owner: aixsilicon:cbb
  maturity: E0
  license: Apache-2.0

classification:
  abstraction: A2                    # 通用复合：加权仲裁机制（非协议绑定）
  primary_domain: arbitration_scheduling
  secondary_domains: [selection_decode]

contract:
  interface: native_req_grant         # 原生 request/grant 位向量 + weight_i 端口；无总线协议语义
  clock_domains: 1                    # WMODE=1 / FAST_GRANT=1 / GRANT_ACK_EN=1 时使用 clk/rst_n（寄存）；纯组合时可选
  ordering: weighted_round_robin      # 按权重公平轮转（配额窗口内按权重比例授权；每拍至多一授权）
  throughput: 1_per_cycle             # 组合路径即时；FAST_GRANT=1 为每拍一授权（1 拍延迟）

# ---------------- 可配置参数 ----------------
parameters:
  NUM_REQ:
    type: int
    default: 8
    legal: {min: 2, max: 64}
    partitions: [2, 4, 8, 16, 32, 64]
    affects: [interface_width, area, timing]
    semantics: 请求输入端数（请求向量位宽）
  WEIGHT_WIDTH:
    type: int
    default: 4
    legal: {min: 2, max: 16}
    partitions: [2, 4, 8, 16]
    affects: [interface_width, area, timing]
    semantics: >-
      每路权重值的位宽（weight_i 各路的编码宽度）。决定权重上限 2^WEIGHT_WIDTH-1，
      也决定配额计数器的位宽（配额窗口 = 各权重之和，上界 N*(2^W-1)）
  WMODE:
    type: int
    default: 0
    legal: [0, 1]
    partitions: [0, 1]
    affects: [area, timing, state_space]
    semantics: >-
      0=quota（配额计数）：每路独立计数已授权次数，达到权重即退出本轮，全部达到后整轮重置
        （实现简单、行为直观；调度=按轮内剩余配额比例）；
      1=smooth（credit 平滑）：统一 credit 减法 WRR，按"当前 credit 最大且有权重"动态选择，
        剩余 credit 跨轮累计（更平滑、更接近理想权重比例，但状态/逻辑更重）
  FAST_GRANT:
    type: int
    default: 0
    legal: [0, 1]
    partitions: [0, 1]
    affects: [latency, timing, area]
    semantics: >-
      0=combinational（grant_o 与 req_i 同拍组合输出，零延迟）；
      1=registered（grant_o 输出寄存，1 拍授权延迟；关键路径从 req_i→grant_o 变为
        reg→grant_o，时序更优；时钟复位：异步复位有效）
  GRANT_ACK_EN:
    type: int
    default: 0
    legal: [0, 1]
    partitions: [0, 1]
    affects: [area, timing, state_space]
    semantics: >-
      0=grant 每拍按当前请求重新决策（纯加权轮转，无锁定，公平窗口=每拍一授权）；
      1=grant 锁定到 grant_ack_i 应答后轮转（消费方背压感知；防授权在未被消费前
        反复切换；适合慢速/需稳定授权场景）
  PC_IMPL:
    type: int
    default: 0
    legal: [0, 1]
    partitions: [0, 1]
    affects: [area, timing]
    semantics: >-
      微架构选择（挂实现/Profile，不进公共功能语义）：
      0=quota_counter 每路独立配额计数器 + RR 选择（实现简单，面积/时序折中）；
      1=deficit_rotate 统一 credit 减法 + 旋转选择（平滑 WRR，时序优，状态集中）

constraints:
  - id: PC-001
    expression: "NUM_REQ >= 2"
    severity: error                   # 仲裁至少 2 路（单路无仲裁语义）
  - id: PC-002
    expression: "NUM_REQ <= 64"
    severity: error                   # RTL 平面/时序上界（64 路加权轮转）
  - id: PC-003
    expression: "WEIGHT_WIDTH >= 2"
    severity: error                   # 权重至少 2 位（权重可分辨 0..3）
  - id: PC-004
    expression: "WEIGHT_WIDTH <= 16"
    severity: error                   # 权重/配额计数器位宽上界（防计数器溢出）
  - id: PC-005
    expression: "WMODE >= 0 and WMODE <= 1"
    severity: error                   # 编码合法域
  - id: PC-006
    expression: "FAST_GRANT >= 0 and FAST_GRANT <= 1"
    severity: error
  - id: PC-007
    expression: "GRANT_ACK_EN >= 0 and GRANT_ACK_EN <= 1"
    severity: error
  - id: PC-008
    expression: "PC_IMPL >= 0 and PC_IMPL <= 1"
    severity: error

# ---------------- 需求（REQ→PROP/tests/configs 映射）----------------
requirements:
  - id: REQ-001
    description: 授权互斥——任意合法请求组合最多一个 grant_o 有效（无多授权/无授权冲突）
    properties: [PROP-WRRA_MUTEX-001]
    tests: [tc_mutex, tc_random, tc_quota_window]
    configs:
      - cfg_num_req2_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
      - cfg_num_req8_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
      - cfg_num_req64_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-002
    description: 权重公平（quota）——每轮配额窗口内，各有效请求的授权次数不超过其权重；
      连续满请求下，授权次数比例趋近权重比例（无超发、不饿死）
    properties: [PROP-WRRA_QUOTA-002]
    tests: [tc_quota_window, tc_random]
    configs:
      - cfg_num_req4_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
      - cfg_num_req8_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-003
    description: 无请求时 grant 全零；有请求必有且仅有一个授权（活性）
    properties: [PROP-WRRA_NONE-003]
    tests: [tc_edge, tc_random]
    configs:
      - cfg_num_req4_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-004
    description: smooth WRR（WMODE=1）——按 credit 最大且有权重的请求动态选择，
      剩余 credit 跨轮累计；权重比例正确且无负 credit（不超发）
    properties: [PROP-WRRA_SMOOTH-004]
    tests: [tc_smooth_ratio, tc_random]
    configs:
      - cfg_num_req8_weight_width4_wmode1_fast_grant0_grant_ack_en0_pc_impl0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-005
    description: FAST_GRANT=1（registered）——grant_o 比组合授权延迟 1 拍，且与组合授权（考虑延迟）一致
    properties: [PROP-WRRA_REG-005]
    tests: [tc_registered, tc_equiv]
    configs:
      - cfg_num_req8_weight_width4_wmode0_fast_grant1_grant_ack_en0_pc_impl0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-006
    description: 多实现（quota_counter/deficit_rotate）共享同一可观察契约且等价
    properties: [PROP-WRRA_EQV-006]
    tests: [tc_equiv, tc_quota_window]
    configs:
      - cfg_num_req8_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
      - cfg_num_req8_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl1
      - cfg_num_req32_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-007
    description: GRANT_ACK_EN=1——grant 锁定到 ack 应答后才轮转；ack 应答后按权重 RR 顺序移动到下一请求
    properties: [PROP-WRRA_ACK-007]
    tests: [tc_ack_lock]
    configs:
      - cfg_num_req8_weight_width4_wmode0_fast_grant0_grant_ack_en1_pc_impl0
    evidence: [build/eda/evidence/g4_functional/functional_sim.txt]
  - id: REQ-008
    description: 非法参数组合在 Elaboration 期被拦截
    properties: []                    # 负向编译证据（非 SVA）
    tests: [tc_negative_elab]
    configs:
      - cfg_num_req1_weight_width4_wmode0_fast_grant0_grant_ack_en0_pc_impl0
      - cfg_num_req8_weight_width1_wmode0_fast_grant0_grant_ack_en0_pc_impl0
      - cfg_num_req8_weight_width17_wmode0_fast_grant0_grant_ack_en0_pc_impl0
    evidence: [build/eda/evidence/g3_static/compile.txt]

# ---------------- 实现变体（多实现：加权轮转结构 trade-off）----------------
implementations:
  - id: impl_quota_counter         # PC_IMPL=0 每路独立配额计数器 + RR 选择（O(N) 计数，直观）
    source: rtl/
    constraints: constraints/
    dependencies: []
    files:
      - rtl/weighted_rr_arbiter.sv
  - id: impl_deficit_rotate        # PC_IMPL=1 统一 credit 减法 + 旋转选择（平滑 WRR，状态集中）
    source: rtl/
    constraints: constraints/
    dependencies: []
    files:
      - rtl/weighted_rr_arbiter.sv

# ---------------- 质量门禁（G0~G8）----------------
quality:
  required_gates: [G0, G1, G2, G3, G4, G5, G6, G7, G8]

# ---------------- PPA 表征 ----------------
characterization:
  benchmark_profiles: []
  measured_region:                   # G6 实测（run-20260829-01/02，E2）：NUM_REQ∈{4,8,16}×{0,1}×WMODE∈{0,1}，WEIGHT_WIDTH=4
    NUM_REQ: [4, 8, 16]
    PC_IMPL: [0, 1]
    WEIGHT_WIDTH: [4]
    WMODE: [0, 1]
  pdk_context: characterization/pdk.yaml   # PDK_READY（sc9_cmos28lp_base_hvt tt_1p00v_25c，DC 综合 E2）

release:
  fusesoc_core: aixsilicon:cbb:weighted_rr_arbiter:0.1.0
