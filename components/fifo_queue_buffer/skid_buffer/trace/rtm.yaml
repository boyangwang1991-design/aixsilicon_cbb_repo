cbb: skid_buffer
requirements:
- id: REQ-001
  type: requirement
  description: '满吞吐与保序（full 实现）——随机 valid/ready/背压流下所有被接受输入按序输出， 无丢无重（参考模型队列整体比对；`in_valid&&in_ready
    |-> ##1 out_valid` 无气泡）。'
  properties:
  - PROP-SKID_ACCEPT-003
  - PROP-SKID_DATA-004
  tests:
  - tc_random
  - tc_backpressure
  configs:
  - cfg_data_w32_impl1_bypass0
  evidence: []
- id: REQ-002
  type: requirement
  description: 反压正确（full 实现）——全满（out_valid && ~out_ready && buf_valid）时 in_ready 拉低；
    输出级空或 SKID 槽有空位时必可接受输入，数据不丢。
  properties:
  - PROP-SKID_READY-001
  - PROP-SKID_READY-002
  tests:
  - tc_backpressure
  - tc_edge
  configs:
  - cfg_data_w8_impl1_bypass0
  evidence: []
- id: REQ-003
  type: requirement
  description: 边界——DATA_W=1 / 极值 / 空流 / 单拍 / 连续背压场景行为正确；输出始终寄存（非 fall-through）。
  properties:
  - PROP-SKID_ACCEPT-003
  tests:
  - tc_edge
  configs:
  - cfg_data_w1_impl1_bypass0
  - cfg_data_w2_impl1_bypass0
  - cfg_data_w1024_impl1_bypass0
  evidence: []
- id: REQ-004
  type: requirement
  description: 非法参数在 Elaboration 期被拦截（DATA_W/BYPASS/IMPL 越界 → generate 块 $error）。
  properties: []
  tests:
  - tc_negative_elab
  configs:
  - cfg_data_w0_impl1_bypass0
  - cfg_data_w1025_impl1_bypass0
  - cfg_data_w32_impl3_bypass0
  - cfg_data_w32_impl1_bypass2
  evidence: []
- id: REQ-005
  type: requirement
  description: 'forward 实现（IMPL=0）——data/valid 打拍 1 拍、ready 组合透传（in_ready=out_ready），
    保序无丢（背压由 ready 直接传导上游），`in_valid&&in_ready |-> ##1 out_valid`。'
  properties:
  - PROP-FWD_ACCEPT-001
  - PROP-FWD_DATA-002
  tests:
  - tc_fwd_random
  - tc_fwd_backpressure
  configs:
  - cfg_data_w32_impl0_bypass0
  - cfg_data_w8_impl0_bypass0
  evidence: []
- id: REQ-006
  type: requirement
  description: BYPASS 直通——BYPASS=1 时 out_valid=in_valid、out_data=in_data、in_ready=out_ready
    （零延迟组合直通，忽略 IMPL）。
  properties:
  - PROP-BYP_DIRECT-001
  tests:
  - tc_bypass
  configs:
  - cfg_data_w32_impl1_bypass1
  - cfg_data_w32_impl0_bypass1
  - cfg_data_w8_impl1_bypass1
  evidence: []
- id: REQ-007
  type: requirement
  description: 'backward 实现（IMPL=2）——`in_ready` 由 FF 寄存（`in_ready_r`，切断反压组合链）， valid/data
    组合透传（`out_valid=in_valid`、`out_data=in_data`，0 数据延迟）； 反压 1 拍延迟传导（`~out_ready &&
    in_valid |-> ##1 ~in_ready`）；保序无丢。'
  properties:
  - PROP-BWD_READY-001
  - PROP-BWD_ACCEPT-002
  - PROP-BWD_DATA-003
  tests:
  - tc_bwd_random
  - tc_bwd_backpressure
  configs:
  - cfg_data_w32_impl2_bypass0
  - cfg_data_w8_impl2_bypass0
  evidence: []
- id: INV-001
  type: requirement
  description: '满吞吐（full 实现，IMPL=1）——输入在 `in_valid && in_ready` 时每拍被接受； 被接受的输入下一拍必然在输出级可见（`in_valid
    && in_ready |-> ##1 out_valid`）， 背压不产生气泡丢拍。'
  properties:
  - PROP-SKID_ACCEPT-003
  tests:
  - tc_random
  - tc_backpressure
  configs: []
  evidence: []
- id: INV-002
  type: requirement
  description: 反压正确（full 实现，IMPL=1）——`in_ready == ~out_valid_r | out_ready | ~buf_valid_r`：
    仅当输出级满、下游未就绪且 SKID 槽满（三条件齐备）时输入才被反压； 输出级空或槽有空位时必可接受输入（数据不丢）。
  properties:
  - PROP-SKID_READY-001
  - PROP-SKID_READY-002
  tests:
  - tc_backpressure
  - tc_edge
  configs: []
  evidence: []
- id: INV-003
  type: requirement
  description: 保序——输入到输出的数据顺序不变（FIFO 语义，参考模型队列比对，适用 forward/full）。
  properties:
  - PROP-SKID_DATA-004
  - PROP-FWD_DATA-002
  tests:
  - tc_random
  - tc_fwd_random
  configs: []
  evidence: []
- id: INV-004
  type: requirement
  description: 输出为寄存（full 实现）——`out_valid`/`out_data` 由 FF 驱动，切断 valid→ready 组合路径；
    ready 方向仅组合依赖寄存状态与下游 out_ready（组合深度 ≤1 级）。
  properties: []
  tests: []
  configs: []
  evidence: []
- id: INV-005
  type: requirement
  description: 'forward 实现（IMPL=0）——`out_valid`/`out_data` 打拍 1 拍（`out_valid_r <=
    in_valid`、 `out_data_r <= in_data`），`in_ready == out_ready`（ready 组合透传，背压直接传导上游），
    `in_valid && in_ready |-> ##1 out_valid`；数据保序、无丢无重。'
  properties:
  - PROP-FWD_ACCEPT-001
  - PROP-FWD_DATA-002
  tests:
  - tc_fwd_random
  - tc_fwd_backpressure
  configs: []
  evidence: []
- id: INV-006
  type: requirement
  description: BYPASS 直通（BYPASS=1）——组合零延迟：`out_valid == in_valid`、`out_data == in_data`、
    `in_ready == out_ready`（忽略 IMPL）。
  properties:
  - PROP-BYP_DIRECT-001
  tests:
  - tc_bypass
  configs: []
  evidence: []
- id: INV-007
  type: requirement
  description: 'backward 实现（IMPL=2）——`in_ready` 由 FF 寄存（`in_ready_r`，**切断反压组合链**，
    `in_ready_r <= out_ready | ~in_valid`）；valid/data **组合透传**（`out_valid==in_valid`、
    `out_data==in_data`，0 数据延迟）；反压 1 拍延迟传导 （`~out_ready && in_valid |-> ##1 ~in_ready`）；保序无丢（ready=0
    时输入不被采样）。'
  properties:
  - PROP-BWD_READY-001
  - PROP-BWD_ACCEPT-002
  - PROP-BWD_DATA-003
  tests:
  - tc_bwd_random
  - tc_bwd_backpressure
  configs: []
  evidence: []
- id: ASM-001
  type: requirement
  description: 输入 valid/数据在等待 `in_ready` 期间必须保持稳定（标准 valid-ready 握手约定）。
  properties: []
  tests: []
  configs: []
  evidence: []
- id: ASM-002
  type: requirement
  description: 复位 `rst_n` 为低有效、异步拉低（FF 用 `negedge rst_n` 复位）；同步释放语义由集成层保证。
  properties: []
  tests: []
  configs: []
  evidence: []
- id: ASM-003
  type: requirement
  description: 输入 X/Z 不承诺（2-state 仿真语义；数据路径 X 传播视为未定义）。
  properties: []
  tests: []
  configs: []
  evidence: []
- id: ASM-004
  type: requirement
  description: BYPASS=1 时 IMPL 参数被忽略（直通语义优先，无微架构）；配置集不产生 BYPASS=1 与 IMPL 冲突组合。
  properties: []
  tests: []
  configs: []
  evidence: []
