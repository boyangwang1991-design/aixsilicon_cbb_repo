# ============================================================
# skid_buffer 行为契约 (behavior.yaml) —— SSOT
# Valid-Ready Skid Buffer：OUT 寄存级 + SKID 槽，满吞吐无气泡
# ============================================================

invariants:
  - id: INV-001
    description: >-
      满吞吐——输入在 `in_valid && in_ready` 时每拍被接受；被接受的输入下一拍必然在
      输出级可见（`in_valid && in_ready |-> ##1 out_valid`），背压不产生气泡丢拍。
    properties: [PROP-SKID_ACCEPT-003]
    tests: [tc_random, tc_backpressure]
  - id: INV-002
    description: >-
      反压正确——`in_ready == ~out_valid_r | out_ready | ~buf_valid_r`：
      仅当输出级满、下游未就绪且 SKID 槽满（三条件齐备）时输入才被反压；
      输出级空或槽有空位时必可接受输入（数据不丢）。
    properties: [PROP-SKID_READY-001, PROP-SKID_READY-002]
    tests: [tc_backpressure, tc_edge]
  - id: INV-003
    description: 保序——输入到输出的数据顺序不变（FIFO 语义，参考模型队列比对）。
    properties: [PROP-SKID_DATA-004]
    tests: [tc_random]
  - id: INV-004
    description: >-
      输出为寄存——`out_valid`/`out_data` 由 FF 驱动，切断 valid→ready 组合路径；
      ready 方向仅组合依赖寄存状态与下游 out_ready（组合深度 ≤1 级）。
    properties: []
    tests: []

assumptions:
  - id: ASM-001
    description: 输入 valid/数据在等待 `in_ready` 期间必须保持稳定（标准 valid-ready 握手约定）。
  - id: ASM-002
    description: 复位 `rst_n` 为低有效、异步拉低（本构件 FF 用 `negedge rst_n` 复位）；同步释放语义由集成层保证。
  - id: ASM-003
    description: 输入 X/Z 不承诺（2-state 仿真语义；数据路径 X 传播视为未定义）。

non_goals:
  - 可旁路直通（BYPASS，属 STR-007 bypassable_register_slice）
  - 多级/可变深度打拍（属 QUE-008 pipeline_fifo）
  - 跨时钟域 / 异步复位释放同步（属 cdc_rdc 套件）
  - fall-through（零延迟直通）输出——本构件输出始终寄存（打拍语义）
