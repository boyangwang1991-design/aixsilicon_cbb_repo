# 表征计划（G6 PPA）— width_conversion_fifo
# 状态：OPTIONAL_UNAVAILABLE（无标准单元库/PDK 上下文）
# 证据等级：E0 (exploratory) —— 无门级综合，仅有 RTL/参数面积趋势的定性分析

benchmark_profiles:
  - id: bench_std_8b_ratio4_dep8
    implementation: impl_pointer_count
    parameters: {DIRECTION: NARROW_TO_WIDE, NARROW_WIDTH: 8, RATIO: 4, DEPTH: 8}
    optimization_goal: area
    consumer: 窄总线存储接口
  - id: bench_fmax_32b_ratio4_dep16
    implementation: impl_pointer_count
    parameters: {DIRECTION: NARROW_TO_WIDE, NARROW_WIDTH: 32, RATIO: 4, DEPTH: 16}
    optimization_goal: fmax
    consumer: 高频数据通路
  - id: bench_w2n_8b_ratio4_dep8
    implementation: impl_pointer_count
    parameters: {DIRECTION: WIDE_TO_NARROW, NARROW_WIDTH: 8, RATIO: 4, DEPTH: 8}
    optimization_goal: area
    consumer: 宽读窄出分拍

measured_region: {}

# ---------------- G6 阻断说明（证据） ----------------
# 尝试 DC 综合（dc_shell V-2023.12-SP3）：
#   target_library 候选均为 Synopsys DesignWare/教学软库（lsi_10k/class/gtech/tc6a_cbacore），
#   get_lib_cells 无法枚举门级单元（非真实标准单元库），DC 无法产生门级网表与面积/时序报告。
#   本机无 PDK/标准单元 .db（无 Nangate/SAED/freePDK）。
# 结论：G6 PPA 标注 OPTIONAL_UNAVAILABLE（E0），不伪造综合数据。
# 恢复条件：提供任一标准单元库（如 SAED32/28nm、Nangate45、freePDK45）后，
#   用 characterization/synth_dc.tcl 对 benchmark_profiles 跑综合 Sweep + Pareto。

# 定性面积趋势（依据 RTL 结构，非门级数据，仅 exploratory 参考）
notes:
  - "面积随 DEPTH 线性增长（窄字 RAM 深度主导）；随 NARROW_WIDTH 线性增长；随 RATIO 影响拼接/拆分逻辑"
  - "W2N 与 N2W 面积接近（同一 RAM + 方向 generate），差值主要在拼接/拆分组合逻辑"
  - "fmax 关键路径：读指针 + RAM 读出 + 拼接 Mux（N2W）或 RAM 读出（W2N）"
