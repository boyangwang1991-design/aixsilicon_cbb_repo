## 1. 验证目标
- 证明宽度转换 + FIFO 缓冲的行为契约（REQ-001..004 / INV-001..006）在参数空间与边界条件下正确；
- 关键不变量（无丢失/无重复/保序/满空安全/拼接拆分语义）由 SVA + 仿真参考模型共同验证；
- 非法参数组合在 elaboration 阶段被 `$error` 拦截（负向）。

## 2. 验证形态（verification-strategy §1 对齐）
| 形态 | 用途 | 工具 |
|---|---|---|
| SVA/断言 | 计数不越界、满空互斥、beat_idx 单调 | RTL 内嵌（`rtl/impl/.../width_conversion_fifo.sv`）+ VCS |
| 定向仿真 | N2W 拼接 / W2N 拆分 / 满空边界 | VCS + 参考模型自校验 TB |
| 随机/背压 | 随机 backpressure 无丢失/无重复/保序 | VCS + TB（`$sampled` 同沿握手） |
| 负向/非法参数 | DEPTH 越界 / DEPTH<RATIO → elaboration `$error` | VCS 编译 negativo |
| 断言变异 | count<=DEPTH 反转为 count>DEPTH 应触发断言失败 | VCS（mutation） |
| Lint | 语法/位宽/多次赋值/未用信号 | SpyGlass lint/lint_rtl |

> 完整 UVM 环境为风险升级选项，本构件未启用（折中：轻量参考模型自校验）。

## 3. 配置矩阵（对应 verification/configs/）
| 集合 | 数量 | 内容 |
|---|---|---|
| mandatory | 1 | 默认 N2W 8b/4/8 |
| boundary | 24 | 各参数 min/max/临界/非 2 次幂（含 W2N 方向） |
| pairwise | 6 | 参数二元交互 |
| negative | 6 | 非法值（NARROW_WIDTH 0/513、RATIO 1、DEPTH 越界等），预期 elaboration 失败 |

