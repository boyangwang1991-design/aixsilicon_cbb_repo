## 5. 负向与变异（G4 要求）
- 非法参数：边界越界/DEPTH<RATIO 由 RTL generate `$error` 在 elaboration 拦截；
- 断言变异：`PROP-WC_CNTRL-001` 变异后断言失败（89 次触发），证明检测能力有效；
- 故障注入：背压/满边界已覆盖；数据级注入（丢数/乱序）由参考模型终局序列比对检出。

