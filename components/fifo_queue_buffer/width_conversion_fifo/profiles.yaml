# ============================================================
# profiles.yaml —— QUE-012 width_conversion_fifo 多实现 Profile
# 共享同一可观察契约；差异仅在优化目标与消费者约束
# ============================================================

profiles:
  area_opt:
    implementation: impl_pointer_count
    parameters: {DIRECTION: NARROW_TO_WIDE, NARROW_WIDTH: 8, RATIO: 4, DEPTH: 8}
    optimization_goal: area
    support: supported
    use_case: 窄总线存储接口，面积敏感（低端 SoC 外设/存储写通路）
  fmax_opt:
    implementation: impl_pointer_count
    parameters: {DIRECTION: NARROW_TO_WIDE, NARROW_WIDTH: 32, RATIO: 4, DEPTH: 16}
    optimization_goal: fmax
    support: supported
    use_case: 高频数据通路，输出侧寄存，关键路径敏感
  low_power:
    implementation: impl_pointer_count
    parameters: {DIRECTION: NARROW_TO_WIDE, NARROW_WIDTH: 8, RATIO: 4, DEPTH: 8}
    optimization_goal: low_power
    support: experimental
    use_case: 低活动率场景，门控与节能（证据不足，允许试用）

# 实现声明
implementation_notes:
  impl_pointer_count:
    max_recommended_scale: {NARROW_WIDTH: 512, RATIO: 64, DEPTH: 1024}
    dependencies: []
    characterized_region: {NARROW_WIDTH: [8, 128], RATIO: [2, 8], DEPTH: [8, 64]}
    known_limits:
      - 宽侧位宽上限 4096 bit（NARROW_WIDTH × RATIO ≤ 4096），超出为非法参数
      - 非 2 次幂 RATIO 时拆分/组装为通用流水，时序略增（见 design.md §6）
