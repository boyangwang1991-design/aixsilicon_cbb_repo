cbb: sync_fifo
requirements:
- id: REQ-001
  type: requirement
  description: 保序：输出数据顺序与写入顺序一致（严格 FIFO）
  properties:
  - PROP-SF_ORD-001
  tests:
  - tc_order
  - tc_stress
  - tc_output_reg
  - tc_no_output_reg
  configs:
  - cfg_dw32_dep16_oreg1
  - cfg_dw8_dep4_oreg0
  evidence: []
- id: REQ-002
  type: requirement
  description: 无丢失：握手上 accepted 的数据不得被丢弃（满时拒收而非覆盖）
  properties:
  - PROP-SF_LOSSLESS-001
  tests:
  - tc_stress
  - tc_backpressure
  configs:
  - cfg_dw32_dep16_oreg1
  - cfg_dw8_dep4_oreg0
  evidence: []
- id: REQ-003
  type: requirement
  description: 无重复：任一数据不得被输出两次
  properties:
  - PROP-SF_NODUP-001
  tests:
  - tc_stress
  - tc_backpressure
  configs:
  - cfg_dw32_dep16_oreg1
  - cfg_dw8_dep4_oreg0
  evidence: []
- id: REQ-004
  type: requirement
  description: 满/空安全：满时不接受新写，空时不输出新数据；指针/计数不越界
  properties:
  - PROP-SF_FULLEMPTY-001
  - PROP-SF_CNTRL-001
  tests:
  - tc_backpressure
  - tc_parallel
  - tc_output_reg
  - tc_no_output_reg
  configs:
  - cfg_dw32_dep16_oreg1
  - cfg_dw8_dep4_oreg0
  - cfg_dw64_dep64_oreg1
  evidence: []
- id: REQ-005
  type: requirement
  description: 满吞吐：连续 push/pop 下每拍 1 进 1 出，无气泡
  properties:
  - PROP-SF_THROUGHPUT-001
  tests:
  - tc_parallel
  - tc_stress
  configs:
  - cfg_dw32_dep16_oreg1
  - cfg_dw64_dep64_oreg1
  evidence: []
- id: INV-001
  type: requirement
  description: 无丢失：写侧握手上 accepted 的数据必须最终被输出（内部不丢数据）
  properties:
  - PROP-SF_LOSSLESS-001
  tests: []
  configs: []
  evidence: []
- id: INV-002
  type: requirement
  description: 无重复：任一元素不得被输出两次
  properties:
  - PROP-SF_NODUP-001
  tests: []
  configs: []
  evidence: []
- id: INV-003
  type: requirement
  description: 保序：输出顺序与写入顺序一致
  properties:
  - PROP-SF_ORD-001
  tests: []
  configs: []
  evidence: []
- id: INV-004
  type: requirement
  description: 满/空安全：满时不接受新写，空时不输出新数据；指针/计数不越界
  properties:
  - PROP-SF_FULLEMPTY-001
  - PROP-SF_CNTRL-001
  tests: []
  configs: []
  evidence: []
- id: INV-005
  type: requirement
  description: 计数守恒：count = count + push - pop（同拍 push+pop 正确合并，不越界）
  properties:
  - PROP-SF_CNTRL-001
  tests: []
  configs: []
  evidence: []
- id: ASM-001
  type: requirement
  description: 输入/输出 ready 可任意周期拉低（无界背压，单周期返回）
  properties: []
  tests: []
  configs: []
  evidence: []
- id: ASM-002
  type: requirement
  description: 写侧 valid 与读侧 valid 均由上游/下游合法组合置位，本构件不假定约束
  properties: []
  tests: []
  configs: []
  evidence: []
- id: ASM-003
  type: requirement
  description: 复位为异步复位（rst_n 低有效），释放同步；复位后指针/计数清零、输出无效
  properties: []
  tests: []
  configs: []
  evidence: []
