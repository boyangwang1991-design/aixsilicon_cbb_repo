# ============================================================
# behavior.yaml —— QUE-001 sync_fifo 行为契约（SSOT）
# 不变量/时序/异常/假设/非目标；每条映射到 PROP（见 RTM）
# ============================================================

# 需求（与 cbb.yaml 同 ID 保持一致；rtm 按 ID 自动去重）
requirements:
  - id: REQ-001
    type: requirement
    description: 保序：输出数据顺序与写入顺序一致（严格 FIFO）
    properties: [PROP-SF_ORD-001]
    tests: [tc_order, tc_stress, tc_output_reg, tc_no_output_reg]
    configs: [cfg_dw32_dep16_oreg1, cfg_dw8_dep4_oreg0]
  - id: REQ-002
    type: requirement
    description: 无丢失：握手上 accepted 的数据不得被丢弃（满时拒收而非覆盖）
    properties: [PROP-SF_LOSSLESS-001]
    tests: [tc_stress, tc_backpressure]
    configs: [cfg_dw32_dep16_oreg1, cfg_dw8_dep4_oreg0]
  - id: REQ-003
    type: requirement
    description: 无重复：任一数据不得被输出两次
    properties: [PROP-SF_NODUP-001]
    tests: [tc_stress, tc_backpressure]
    configs: [cfg_dw32_dep16_oreg1, cfg_dw8_dep4_oreg0]
  - id: REQ-004
    type: requirement
    description: 满/空安全：满时不接受新写，空时不输出新数据；指针/计数不越界
    properties: [PROP-SF_FULLEMPTY-001, PROP-SF_CNTRL-001]
    tests: [tc_backpressure, tc_parallel, tc_output_reg, tc_no_output_reg]
    configs: [cfg_dw32_dep16_oreg1, cfg_dw8_dep4_oreg0, cfg_dw64_dep64_oreg1]
  - id: REQ-005
    type: requirement
    description: 满吞吐：连续 push/pop 下每拍 1 进 1 出，无气泡
    properties: [PROP-SF_THROUGHPUT-001]
    tests: [tc_parallel, tc_stress]
    configs: [cfg_dw32_dep16_oreg1, cfg_dw64_dep64_oreg1]

# ---------------- 不变量 ----------------
invariants:
  - id: INV-001
    description: 无丢失：写侧握手上 accepted 的数据必须最终被输出（内部不丢数据）
    properties: [PROP-SF_LOSSLESS-001]
    severity: error
  - id: INV-002
    description: 无重复：任一元素不得被输出两次
    properties: [PROP-SF_NODUP-001]
    severity: error
  - id: INV-003
    description: 保序：输出顺序与写入顺序一致
    properties: [PROP-SF_ORD-001]
    severity: error
  - id: INV-004
    description: 满/空安全：满时不接受新写，空时不输出新数据；指针/计数不越界
    properties: [PROP-SF_FULLEMPTY-001, PROP-SF_CNTRL-001]
    severity: error
  - id: INV-005
    description: 计数守恒：count = count + push - pop（同拍 push+pop 正确合并，不越界）
    properties: [PROP-SF_CNTRL-001]
    severity: error

# ---------------- 集成假设 ----------------
assumptions:
  - id: ASM-001
    description: 输入/输出 ready 可任意周期拉低（无界背压，单周期返回）
    properties: []
    severity: info
  - id: ASM-002
    description: 写侧 valid 与读侧 valid 均由上游/下游合法组合置位，本构件不假定约束
    properties: []
    severity: info
  - id: ASM-003
    description: 复位为异步复位（rst_n 低有效），释放同步；复位后指针/计数清零、输出无效
    properties: []
    severity: info

# ---------------- 时序语义 ----------------
timing:
  first_beat_latency: 2        # 默认 OUTPUT_REG=1 → 读侧寄存级延迟 2 拍；OUTPUT_REG=0 时为 1
  full_throughput: true        # 连续 push/pop 下每拍 1 进 1 出
  backpressure_propagation: 2  # OUTPUT_REG=1 时空→valid 传播 2 拍；OUTPUT_REG=0 时 1 拍
  output_reg_mode: non_fwft    # 标准弹出语义：数据写拍后下一拍才可被弹出（非直通读）

# ---------------- 异常行为 ----------------
exceptions:
  - id: EXC-001
    description: 复位释放后所有指针/计数清零，输出 valid 拉低，输出数据无效
    handling: reset_sync

# ---------------- 非目标 ----------------
non_goals:
  - 异步/多时钟域（CDC，由 QUE-002 Asynchronous FIFO 覆盖）
  - Fall-through / First-word-fall-through（由 QUE-003 覆盖）
  - 纯移位寄存器实现（由 QUE-004 覆盖）
  - 专用 SRAM 接口/例化（由 QUE-005 覆盖）
  - 宽度转换（由 QUE-012 width_conversion_fifo 覆盖）
  - 乱序 / QoS / 仲裁 / 多通道 / 可编程深度