# verification/plan.yaml — parallel_data_fetch 验证计划（C1 建立，C4 更新同一文件）
# 纯 YAML；C4 用真实 run 结果替换 status: planned，并冻结。
target: parallel_data_fetch

verification_forms:
  - id: sim_functional
    method: simulation
    scope: 定向 + 约束随机 + 错误注入（同步/异步模式、切片实现等价）
  - id: static_baseline
    method: static
    scope: compile / elaboration / 负向参数 $error 拦截（G3）
  - id: sim_config_matrix
    method: simulation
    scope: 生成配置集矩阵回归（mandatory/boundary/pairwise/negative 的代表点，G5）

# configs: 由 cbb_tool.py config-gen 生成后按实际 config_id 回填（禁止凭记忆手写）
# 全部 219 条 config 的完整清单见 verification/configs/manifest.yaml 与各集合文件；
# 此处只列 REQ 追踪直接引用的代表点，避免与生成产物双维护。
