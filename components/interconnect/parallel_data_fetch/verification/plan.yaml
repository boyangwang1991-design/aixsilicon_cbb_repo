testcases:
  - id: tc_sync_basic
    status: planned
    acceptance: 同步模式典型配置下 A 端结果与 B 端被接受时快照逐 bit 一致，且连续多次请求各自独立。
  - id: tc_beat1
    status: planned
    acceptance: BEAT_COUNT=1（DATA_WIDTH=LINK_WIDTH）时单拍发送、单拍 last 正确且不产生零宽信号。
  - id: tc_pipe_stages
    status: planned
    acceptance: LINK_PIPE_STAGES=0/1/8 下 bundle 各字段严格同级延迟，valid/last/parity/epoch 不失配。
  - id: tc_snapshot_hold
    status: planned
    acceptance: 发送期间持续改变 b_data_i，返回值仍等于被接受时刻的 snapshot。
  - id: tc_backpressure
    status: planned
    acceptance: A 端长时间不接受 response 时输出保持稳定；provider 侧不受 A 端业务反压影响。
  - id: tc_provider_latency
    status: planned
    acceptance: provider 零等待/固定等待/随机等待下事务均正确完成，零等待允许 fetch_ready 与 data_valid 同拍。
  - id: tc_slice_equivalence
    status: planned
    acceptance: SLICE_IMPL=0/1/2 在相同功能配置下有效输出序列（数据、顺序、last、错误）完全一致。
  - id: tc_random
    status: planned
    acceptance: 约束随机参数/数据/provider 延迟/A 端背压下 scoreboard 无失配，无丢无重无混事务。
  # 异步模式（ASYNC_MODE=1）双时钟回归；激励矩阵与判据见 docs/design.md §8
  - id: tc_async_modes
    status: planned
    acceptance: >-
      A 快 B 慢(5:20)/A 慢 B 快(20:5)/临界(11:20, RSP_FIFO_DEPTH==BEAT_COUNT)/同频异相(10:10 相位 0/3/7)
      四种比例下各 40 次事务：成功结果与 B 端被接受快照逐 bit 一致；无 ERR_TIMEOUT/ERR_FIFO/ERR_PROTOCOL；
      临界比例下 B 端未获 FIFO 空间时不得发送（reserve_ok 门控生效）。
  - id: tc_async_reset_order
    status: planned
    acceptance: >-
      三种复位顺序（B 先/A 先/同时但错开释放）下：复位期间两端 link_up 均为 0 且不接受请求；
      释放后 link_up 重新建立并可完成新事务；事务中任一端复位使本次事务以错误结束且不自动重发。
  - id: tc_reset
    status: planned
    acceptance: 各状态复位后 valid/busy 在规定周期内清零，输出为 RESET_VALUE 语义值，随后可重新接受请求。
  - id: tc_error_inject
    status: planned
    acceptance: parity 翻转、last 提前/缺失/重复、beam 计数超限、provider error、epoch 不匹配均返回对应错误码。
  - id: tc_negative_elab
    status: planned
    acceptance: 非法参数组合在 elaboration 阶段被 $error 拒绝（工具非零退出且报出参数诊断，非崩溃）。

matrix:
  representative: false
  baseline_configs: []
  notes: >-
    C4 由 config-gen 生成 mandatory/boundary/pairwise/negative 配置集后回填真实 config_id；
    异步模式与切片等价的代表性配置须覆盖 ASYNC_MODE=1 与 SLICE_IMPL=0/1/2。

evidence:
  static_baseline: build/eda/evidence/g3_static/
  functional: build/eda/evidence/g4_functional/
  reports: reports/quality/
  note: 原始 EDA 日志落 build/（不入库）；脱敏摘要与 Gate 记录落 reports/。
