# ============================================================
# profiles.yaml — accumulator 使用画像（ARI-006, A2/P0）
# 描述不同使用场景下的推荐参数组合（单实现 impl_single_entry，V1.0 基线）。
# Profile 支持状态与 PPA 结论在表征（G6）后回填；当前为 planning 意图。
# ============================================================

profiles:
  prof_default:
    implementation: impl_single_entry
    parameters:
      INPUT_WIDTH: 16
      ACC_WIDTH: 32
      SIGNED: true
      OP_MODE: 0
      OVERFLOW_MODE: 0
      LOAD_EN: true
      STATUS_EN: true
      OPERAND_ISOLATION: 0
    optimization_goal: balanced
    support: experimental
    use_case: 默认通用累加（部分和累加、事件求和）
  prof_area_opt:
    implementation: impl_single_entry
    parameters:
      INPUT_WIDTH: 8
      ACC_WIDTH: 16
      SIGNED: true
      OP_MODE: 0
      OVERFLOW_MODE: 0
      LOAD_EN: false
      STATUS_EN: true
      OPERAND_ISOLATION: 0
    optimization_goal: area
    support: experimental
    use_case: 面积优先的窄位宽累加（大量实例化）
  prof_power_opt:
    implementation: impl_single_entry
    parameters:
      INPUT_WIDTH: 16
      ACC_WIDTH: 32
      SIGNED: true
      OP_MODE: 2
      OVERFLOW_MODE: 0
      LOAD_EN: true
      STATUS_EN: true
      OPERAND_ISOLATION: 1
    optimization_goal: power
    support: experimental
    use_case: 功耗优先（低活动率场景，操作数隔离降低无效翻转）
  prof_saturating:
    implementation: impl_single_entry
    parameters:
      INPUT_WIDTH: 16
      ACC_WIDTH: 32
      SIGNED: true
      OP_MODE: 2
      OVERFLOW_MODE: 1
      LOAD_EN: true
      STATUS_EN: true
      OPERAND_ISOLATION: 0
    optimization_goal: correctness_bound
    support: experimental
    use_case: 有符号积分/误差累计（需饱和保护防溢出）
  prof_nco:
    implementation: impl_single_entry
    parameters:
      INPUT_WIDTH: 16
      ACC_WIDTH: 32
      SIGNED: false
      OP_MODE: 0
      OVERFLOW_MODE: 0
      LOAD_EN: true
      STATUS_EN: false
      OPERAND_ISOLATION: 0
    optimization_goal: balanced
    support: experimental
    use_case: NCO 相位累加（模 2^W 回绕、无符号、无需溢出状态）

# 每个实现声明（V1.0 单实现基线）
implementation_notes:
  impl_single_entry:
    max_recommended_scale: {INPUT_WIDTH: 64, ACC_WIDTH: 128}
    dependencies: []
    characterized_region: {}
    known_limits:
      - 状态反馈更新就是一个时钟周期（无任意 LATENCY 参数）；输出额外寄存器由独立包装处理
      - A→A 反馈路径含进位传播、饱和判定与选择逻辑，宽位宽时序由综合器优化，未实测前不承诺频率
      - 多上下文交织/偏斜流水/carry-save 冗余反馈为独立增强探索，不在 V1.0 支持范围
