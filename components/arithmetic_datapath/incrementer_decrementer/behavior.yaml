# ============================================================
# incrementer_decrementer 行为契约 (behavior.yaml) —— SSOT
# Incrementer/Decrementer：Counter 专用 ±1 运算（模 2^W 回绕）
# ============================================================

invariants:
  - id: INV-001
    description: >-
      正确性——对任意合法 2-state 输入 (din, inc_en, dec_en)（inc_en 与 dec_en 不同时
      断言，ASM-002），dout 与独立参考模型一致：inc_en=1 → dout=din+1（模 2^W），
      dec_en=1 → dout=din-1（模 2^W），均不使能 → dout=din。
      两实现（ripple/segmented）共享同一可观察契约。
    properties: [PROP-INC_DEC_CORRECT-001]
    tests: [tc_exhaust_w8, tc_random]
  - id: INV-002
    description: >-
      回绕——din=全1 且 inc_en=1 → dout=0（回绕）；din=0 且 dec_en=1 → dout=全1
      （回绕）；无算术截断/饱和错误。
    properties: [PROP-INC_DEC_WRAP-002]
    tests: [tc_edge, tc_random]
  - id: INV-003
    description: >-
      溢出/借位标志——carry_out=(inc_en & &din) | (dec_en & ~|din)；仅在 inc/dec
      使能且输入到达边界时置位，其余为 0。
    properties: [PROP-INC_DEC_CARRY-003]
    tests: [tc_edge, tc_random]

assumptions:
  - id: ASM-001
    description: 输入 X/Z 不承诺（2-state 仿真语义；X 传播视为未定义，断言以 $isunknown 规避）。
  - id: ASM-002
    description: inc_en 与 dec_en 不同时断言（互斥）；同时断言行为未定义（调用方负责）。
  - id: ASM-003
    description: DATA_W/ID_IMPL/SEG_W/CG_EN 为编译期参数，不运行时切换（生成/参数化语义）。
  - id: ASM-004
    description: 纯组合，无时钟/复位；调用方负责输入稳定窗口与输出采样时序。
  - id: ASM-005
    description: CG_EN=1（自动 Carry/Data Gating）不新增外部使能端口——基于已有 inc_en/dec_en
      自动生效（active=inc_en|dec_en）；hold 模式（active=0）下进位链强制 0、XOR 退化为直通，
      输出语义与 CG_EN=0 完全等价（dout=din、carry_out=0）。

non_goals:
  - 带时钟/寄存的周期计数或累加（见 CTL-* 计数器、MON-* 事件计数器）
  - 通用加/减法器（任意加数，见 ARI-002 adder_subtractor）
  - 多操作数归约（见 ARI-005 adder_tree、ARI-003 carry_save_adder）
  - 动态/可编程位宽（参数固定，编译期确定）
