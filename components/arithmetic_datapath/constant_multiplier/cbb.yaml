  source_contract: constant_multiplier_contract.md
  interface: valid_ce
  clock_domains: 1
  ordering: in_order
  throughput: 1_per_enabled_cycle
  hwif_rationale: 局部算术 valid/ce 接口，无标准总线依赖
parameters:
