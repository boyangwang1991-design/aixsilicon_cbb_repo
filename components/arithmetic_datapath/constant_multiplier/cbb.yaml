    type: enum
    default: 0
    description: OUTPUT_MODE，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
    legal: &id001
    - 0
    - 1
    partitions: *id001
    encoding:
      0: FULL
      1: QUANTIZED
  ROUND_MODE:
    type: enum
    default: 0
    description: ROUND_MODE，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
    legal: &id002
    - 0
    - 1
    - 2
    partitions: *id002
    encoding:
      0: FLOOR
      1: TOWARD_ZERO
      2: NEAREST_EVEN
  OVERFLOW_MODE:
    type: enum
    default: 0
    description: OVERFLOW_MODE，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
    legal: &id003
    - 0
    - 1
    partitions: *id003
    encoding:
      0: WRAP
      1: SATURATE
  IMPL:
    type: enum
    default: 0
    description: IMPL，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
    legal: &id004
    - 0
    - 1
    - 2
    - 3
    - 4
    partitions: *id004
    encoding:
      0: NATIVE
      1: BINARY
      2: CSD
      3: ADDER_GRAPH
      4: AUTO
  OUTPUT_WIDTH:
    type: int
    default: 256
    description: OUTPUT_WIDTH，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
    legal:
      min: 1
      max: 256
    partitions:
    - 1
    - 8
    - 256
  OUTPUT_SIGNED:
    type: bool
    default: true
    description: OUTPUT_SIGNED，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
  SHIFT_RIGHT:
    type: int
    default: 0
    description: SHIFT_RIGHT，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
    legal:
      min: 0
      max: 256
    partitions:
    - 0
    - 1
    - 256
  LATENCY:
    type: int
    default: 0
    description: LATENCY，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
    legal:
      min: 0
      max: 8
    partitions:
    - 0
    - 1
    - 2
    - 8
  OPERAND_ISOLATION:
    type: bool
    default: false
    description: OPERAND_ISOLATION，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
constraints:
- id: PC-001
  expression: OUTPUT_MODE != 0 or (SHIFT_RIGHT == 0 and ROUND_MODE == 0 and OVERFLOW_MODE
    == 0)
  severity: error
- id: PC-002
  expression: COEFF >= -(1 << (COEFF_WIDTH-1)) and COEFF < (1 << (COEFF_WIDTH-1))
  severity: error
