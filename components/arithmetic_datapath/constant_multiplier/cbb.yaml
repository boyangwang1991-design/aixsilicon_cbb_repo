    type: int
    default: 16
    description: INPUT_WIDTH，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
    legal:
      min: 1
      max: 128
    partitions:
    - 1
    - 2
    - 8
    - 16
    - 128
  INPUT_SIGNED:
    type: bool
    default: true
    description: INPUT_SIGNED，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
  COEFF:
    type: int
    default: 3
    description: COEFF，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
    partitions:
    - 0
    - 1
    - -1
    - 3
    - 45
    - 85
    - -170141183460469231731687303715884105728
    legal:
      min: -170141183460469231731687303715884105728
      max: 170141183460469231731687303715884105727
  COEFF_WIDTH:
    type: int
    default: 128
    description: COEFF_WIDTH，语义见源契约及 tools/generate.py 的规范化规则
    affects:
    - area
    - timing
    - interface_width
    legal:
