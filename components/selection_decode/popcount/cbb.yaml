# cbb.yaml SSOT 元数据（对齐 templates/cbb.yaml 与 artifact-contract §1）
# SEL-014 popcount：纯组合 Hamming 权重计数原子构件（A1/P1）
# 嵌套依赖：无（dependencies 为空）；验证资产随包自足

schema_version: 1.0

cbb:
  id: aixsilicon:cbb:popcount
  name: popcount
  version: 0.1.0
  owner: aixsilicon:cbb
  maturity: E0
  license: Apache-2.0

classification:
  abstraction: A1
  primary_domain: selection_decode
  secondary_domains: [arithmetic_datapath]

contract:
  interface: native_vector        # 无总线协议语义，不引用 HWIF（理由见 cbb_spec.md §5）
  clock_domains: 0                # 纯组合无时钟端口
  ordering: not_applicable        # 无事务概念（函数式组合）
  throughput: combinational       # 组合逻辑深度即时响应（G6 以 LOGIC_DEPTH 度量）

# ---------------- 可配置参数 ----------------
parameters:
  INPUT_WIDTH:
    type: int
    default: 64
    legal: {min: 4, max: 256}
    partitions: [4, 8, 16, 32, 64, 128, 256]
    affects: [interface_width, area, timing]
    semantics: 输入向量位宽（计数对象宽度）
  CHUNK_W:
    type: int
    default: 8
    legal: {min: 4, max: 8}
    partitions: [4, 8]
    affects: [area, timing]
    semantics: lookup 实现分段位宽（2^CHUNK_W 项表）；仅影响 impl_lookup

constraints:
  - id: PC-001
    expression: "INPUT_WIDTH >= 4"
    severity: error               # 防退化零宽/过窄场景
  - id: PC-002
    expression: "CHUNK_W >= 4 and CHUNK_W <= 8"
    severity: error               # 控制查找表规模在 16~256 项可映射区间

# ---------------- 行为契约见 behavior.yaml ----------------

# ---------------- 需求（REQ→PROP/tests/configs 映射）----------------
requirements:
  - id: REQ-001
    description: cnt_o 恒等于 data_i 的 Hamming 权重
    properties: [PROP-PC_FUNC-001]
    tests: [tc_exhaust_w8, tc_random]
    configs: []
  - id: REQ-002
    description: 数值域边界正确——全 0 时输出 0、全 1 时输出 INPUT_WIDTH
    properties: [PROP-PC_BOUND-002]
    tests: [tc_edge]
    configs: []
  - id: REQ-003
    description: 三实现共享同一可观察契约且两两等价
    properties: [PROP-PC_EQV-003]
    tests: [tc_equiv_lec]
    configs: []
  - id: REQ-004
    description: 非法参数组合在 Elaboration 期被拦截
    properties: []                # 负向编译证据（非 SVA）
    tests: [tc_negative_elab]
    configs: []

# ---------------- 实现变体（Change C2：打平布局，四实现）----------------
# rtl 打平规范（用户指令）：无子目录；wrapper/tree/lut 直写于 popcount.sv，
# wallace 为 gen_schedule.py 生成的显式 FA 网表（W=64 物化；Change C3 移除 dadda）
implementations:
  - id: impl_tree                 # PC_IMPL=0 默认推荐（28nm@1GHz 主选）
    source: rtl/
    constraints: constraints/
    dependencies: []
    files:
      - rtl/popcount.sv
  - id: impl_wallace              # PC_IMPL=1 显式 FA 网表（Python 生成）
    source: rtl/
    constraints: constraints/
    dependencies: []
    files:
      - rtl/popcount.sv
      - rtl/popcount_compressed.sv  - id: impl_lut                  # PC_IMPL=3 分级查表 nibble→byte对→归并树
    source: rtl/
    constraints: constraints/
    dependencies: []
    files:
      - rtl/popcount.sv

# ---------------- 质量门禁（G0~G8）----------------
quality:
  required_gates: [G0, G1, G2, G3, G4, G5, G6, G7, G8]

# ---------------- PPA 表征 ----------------
characterization:
  benchmark_profiles: []          # G6 pdk-scan 后按 run-id 填充
  measured_region: {}             # 计划 Sweep 区域：INPUT_WIDTH∈{8,16,32,64,128}×3impl

release:
  fusesoc_core: aixsilicon:cbb:popcount:0.1.0
