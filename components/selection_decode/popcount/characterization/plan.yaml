# characterization/plan.yaml — popcount PPA 表征计划与结论
schema: cbb-characterization/0.1

context:
  pdk_yaml: pdk.yaml                    # SSOT 快照（cbb_tool.py pdk-scan 固化）
  status: PDK_READY                     # G6 强制真实综合
  library: sc9_cmos28lp_base_hvt (GF21LB004-FB-00000-r5p0-03rel0, HVT)
  corner: tt_nominal_max_1p00v_25c
  tool: dc_shell V-2023.12-SP3
  constraint: virtual clock 2.5ns (400MHz 起步) + in/out delay 0.5 + BUFH_X4M_A9TH drive
  evidence_level: E2                    # 真实门级综合 + 单 corner；多 corner/物理感知未做

runs:
  - run_id: run-20260827-01
    date: 2026-08-27
    script: synth_sweep.tcl
    matrix: {impl}×{8,16,32,64,128} = 15 点
    evidence: evidence/ppa/run-20260827-01/
    method_note: >
      实现选择经子模块顶层直证（dc_shell 对 wrapper generate-case 的
      -parameters 覆盖不生效，case 恒 default 分支）。

results_summary:                         # Total cell area (μm²) / worst slack @2.5ns
  - {w: 8,   tree: "12.05 /+0.53", colcmp: "12.05 /+0.53", lookup: "12.05 /+0.53"}
  - {w: 16,  tree: "27.26 /+0.43", colcmp: "100.39 / 0.00", lookup: "27.26 /+0.43"}
  - {w: 32,  tree: "64.82 /+0.07", colcmp: "417.46 / 0.00", lookup: "64.82 /+0.07"}
  - w64: {tree: "124.02 /+0.09", colcmp: "1258.22 /−1.11", lookup: "124.02 /+0.09"}
  - {w: 128, tree: "248.74 /+0.04", colcmp: "2551.30 /−2.20", lookup: "248.74 /+0.04"}
  # 注：lookup 与 tree 数据趋同 = DC 将 case 表折叠为同构加法树（函数等价下
  # 综合器最优实现收敛），属预期行为而非工具错误；小宽度两者本就等价 Pareto。

pareto_conclusion:
  - W≤32：三实现面积差异 ≤ 常数比例，tree/lut 共享左端点，全部 MET
  - W≥64：colcmp 面积 ~10× 且时序违例 → 列计数递推形态（常数÷/% 网络）
          在本工艺证实不优；Wallace/Dadda 显式 FA 身份网表是正确替代路线，
          登记为后续 Change Plan（design.md §1.2 已预留 QoR 说明）
  - 推荐 Profile：tree_default（supported）；lut_compact 与 tree 合并观察；
                  fmax_opt 降级 experimental 直至显式 FA 形态重测

next_actions:
  - 显式 FA 身份网表重测 colcmp（Change Plan 触发后）
  - 多 corner sweep（ss/ff）补 E3 上探
  - 消费者场景绑定权重（Use Case 批准后定推荐排序终稿）
