# profiles.yaml —— 多实现 Profile（Change C2 定稿：四实现）
# 共享同一可观察契约，差异仅在 PPA trade-off（domain-rules §4）；
# G6 帕累托寻优（run-20260827-03）支撑以下支持状态

schema_version: "1.0"
cbb: aixsilicon:cbb:popcount

profiles:
  - id: tree_default
    implementation: impl_tree
    parameters:
      INPUT_WIDTH: default
    optimization_target: balanced
    use_case: ECC 编码器校验位权重、通用计数场景
    support_status: supported
    notes: O(log W) 加法树；G6 Pareto 全宽度支配点（W64 124μm²/+0.09）；默认推荐

  - id: lut_compact
    implementation: impl_lut
    parameters:
      INPUT_WIDTH: default
    optimization_target: area_small_w
    use_case: 小宽度计数（≤32）、FPGA 移植视图
    support_status: supported
    notes: 分级查表 nibble-LUT4→byte对→归并树（C2 重构）；大 W 与 tree 综合趋同

  - id: wallace_exp
    implementation: impl_wallace
    parameters:
      INPUT_WIDTH: 64             # 网表当前物化 W=64 单档
    optimization_target: structure_exploratory
    use_case: 压缩结构探索/教学资产；W≥256 扩展后复测潜力
    support_status: experimental  # G6: 271μm²/0.00 vs tree 124μm²/+0.09（2.2× 面积代价）
    notes: 显式 FA 网表（Python 生成）——比列计数递推 −78% 面积，结构化路线验证成功

# 依赖 DAG：零运行时依赖（各 impl dependencies=[]），自动无环；
# PC_IMPL 编译期四路分派见 rtl/popcount.sv；G2 评审通过（docs/design.md 冻结稿）。
