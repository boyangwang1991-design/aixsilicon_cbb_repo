# ============================================================
# popcount 行为契约 (behavior.yaml) —— SSOT
# 纯组合 Hamming 权重：无状态/无时钟，函数语义可全枚举验证
# 每个条目稳定 ID（INV/ASM），映射到属性(PROP)与测试
# ============================================================

requirements: []   # REQ-001..004 定义于 cbb.yaml（同 ID 去重由 rtm 工具处理）

invariants:
  - id: INV-001
    description: 函数一致性——对任意合法 2-state 输入，cnt_o == popcount(data_i)（逐位求和黄金模型）
    properties: [PROP-PC_FUNC-001]
    tests: [tc_exhaust_w8, tc_random, tc_equiv_lec]
    severity: error
  - id: INV-002
    description: 值域封闭性——0 <= cnt_o <= INPUT_WIDTH 且两端点可达（全 0 → 0；全 1 → INPUT_WIDTH）
    properties: [PROP-PC_BOUND-002]
    tests: [tc_edge]
    severity: error
  - id: INV-003
    description: 实现等价性——impl_tree / impl_column_compress / impl_lookup 对同一输入产生相同 cnt_o（同一可观察契约）
    properties: [PROP-PC_EQV-003]
    tests: [tc_equiv_lec]
    severity: error

assumptions:
  - id: ASM-001
    description: 输入为 2-state 数据时结果才有定义；含 X 输入不作输出承诺（组合传播，SVA 仅 2-state 采样）
    properties: []
    severity: info
  - id: ASM-002
    description: 构件无时钟端口；消费侧需时序收敛自行寄存打拍
    properties: []
    severity: info

# 时序语义：组合构件以逻辑深度为度量对象（非 latency 契约项）
timing:
  first_beat_latency: none        # 无握手协议
  full_throughput: true           # 组合路径即时响应
  logic_depth_model: per_impl     # impl×W 的 LOGIC_DEPTH 由 G6 综合报告度量

exceptions: []                    # 无状态构件，无非目标行为分支

non_goals:
  - 流水化/寄存输出版本（消费侧职责，A1 保持原子性）
  - 加权/掩码 popcount（mask 交调用方先与运算）
  - CDC 处理（纯单域组合）

# 参数检查失败（PC-001/PC-002 违反）在 Elaboration 期由 RTL generate $error 拦截：
# 映射 REQ-004 / tc_negative_elab（负向编译证据：vcs 非零退出 + $error ID）。
