usage_discipline:
- 权威视图只在 extracted/*-FB-* bundle；勿重复解压 archive/
- DC/VCS 避坑见 PDK 根 README 第 7 节（-full64/-timescale/set_driving_cell 等）
- operating_conditions 名随 corner 变化，set_operating_conditions 必须同步
- 本文件是工艺上下文快照，不是 PPA 表征结果；正式结论绑定 run_id 证据
