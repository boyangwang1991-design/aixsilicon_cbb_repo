[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbbrepo-management"
version = "1.0.0"
description = "CBB / IP Repository Management Suite - publish and manage CBB & IP packages to unified GitHub repos"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ipkg = "scripts.ipkg_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
addopts = "-q"
