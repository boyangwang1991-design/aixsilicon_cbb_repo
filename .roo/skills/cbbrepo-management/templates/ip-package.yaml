# ip-package.yaml - IP 包描述模板（统一建仓）
# 自动由 ipkg stage 从 ip-development-suite 构建结果 manifest.yaml 生成
schema_version: "2.0"

# 基本信息
name: apb_gpio_lite
version: "1.0.0"
vendor: rtl-team
library: rtl

# 描述
description: |
  APB GPIO Lite Controller: 8-bit GPIO output data, output enable,
  input readback and rising-edge interrupt on an APB slave interface.

# 许可证
license: MIT

# 统一仓内路径（相对统一仓根）
path: ips/rtl-team/apb_gpio_lite/1.0.0

# 质量门禁（来自构建结果 manifest）
quality:
  gates:
    G0: pass
    G1: pass
    G2: pass
    G3: pass
    G4: pass
    G5: pass

# 冻结清单 SHA-256（manifest.yaml 哈希）
manifest_sha256: ""

# 依赖（可选）
dependencies: []
  # - name: common_lib
  #   version: ">=1.0.0"
  #   vendor: rtl-team
  #   library: rtl

# FuseSoC 信息（core 复用 08-fusesoc-packager 产物）
fusesoc:
  core: rtl-team:rtl:apb_gpio_lite:1.0.0
  cores: ips/rtl-team/apb_gpio_lite/1.0.0/fusesoc
