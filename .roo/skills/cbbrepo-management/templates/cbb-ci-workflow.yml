# GitHub Actions CI for the CBB platform repository (PPA-aware CBB library)
# Copy into .github/workflows/ci.yml of the CBB repository.
# CBB 平台适配：扫描 components/ adapters/ templates/ 下的 *.core，
# 跳过暂无 RTL 的占位 core，并校验 registry.yaml（cbbs 条目）。
name: CBB Platform CI

on:
  push:
    paths: ["components/**", "adapters/**", "templates/**", "fusesoc.conf", "registry.yaml"]
  pull_request:
    paths: ["components/**", "adapters/**", "templates/**"]

jobs:
  fusesoc-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FuseSoC
        run: pip install fusesoc
      - name: Add CBB library
        run: fusesoc library add aixsilicon-cbb .
      - name: Lint cores with RTL (skip placeholders)
        run: |
          set -e
          found=0
          for core in $(find components adapters templates -name '*.core' | sort); do
            coredir=$(dirname "$core")
            if ! compgen -G "${coredir}/../rtl/impl/*.sv" >/dev/null 2>&1; then
              echo "skip (no RTL yet): ${core}"
              continue
            fi
            vlnv=$(grep -m1 '^name:' "$core" | awk '{print $2}')
            echo "== lint ${vlnv} =="
            fusesoc core lint "$vlnv"
            found=1
          done
          [ "$found" -eq 0 ] && echo "No RTL cores yet - nothing to lint"

  validate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate registry.yaml (cbbs)
        run: |
          python -c "
import yaml
d = yaml.safe_load(open('registry.yaml'))
assert d.get('schema_version') == '2.0', 'schema_version must be 2.0'
assert isinstance(d.get('cbbs'), list), 'cbbs must be a list'
for e in d.get('cbbs', []):
    assert e.get('id') and e.get('name') and e.get('path'), 'each cbb needs id/name/path'
print('registry.yaml valid:', len(d.get('cbbs', [])), 'CBBs')
"
