# Unified repo CI: scan every FuseSoC core under ips/ and run lint.
name: IP Unified CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-all-cores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FuseSoC
        run: pip install fusesoc

      - name: Lint every core in ips/
        run: |
          fusesoc library add ip-unified .
          failed=0
          for core in $(find ips -name '*.core'); do
            echo "Linting $core"
            name=$(grep '^name:' "$core" | head -1 | sed 's/name:[ ]*//')
            fusesoc run --target lint "${name}:latest" || failed=1
          done
          exit $failed
