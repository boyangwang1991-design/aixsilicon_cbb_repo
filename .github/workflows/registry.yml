name: Registry consistency
on:
  workflow_dispatch:
jobs:
  validate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python3 scripts/build_cbb_structure.py --check
      - run: python3 scripts/update_registry_readme.py --check
      - run: python3 scripts/check_requirement_contracts.py
